[package]
name = "zcash-payment-service"
version = "0.1.0"
edition = "2021"
description = "Reusable Zcash payment service crate and HTTP microservice"

[workspace]
resolver = "2"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
hex = "0.4"
hmac = "0.12"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "=0.3.36", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full", "test-util"] }
tonic = { version = "0.14.5", features = ["transport", "tls-webpki-roots"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zcash_client_backend = { version = "0.25.0", features = ["orchard", "lightwalletd-tonic-transport"] }
zcash_client_sqlite = { version = "0.23.0", features = ["orchard"] }
zcash_keys = { version = "0.17.0", features = ["std", "orchard", "sapling"] }
zcash_primitives = "0.31.0"
zcash_protocol = "0.11.0"
zip32 = "0.3"
sapling = { package = "sapling-crypto", version = "0.9.0" }
orchard = "0.16.0"
zcash_note_encryption = "0.5.1"
incrementalmerkletree = "0.9"
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng"] }
subtle = "2"
rayon = "1"

[dev-dependencies]
tempfile = "=3.27.0"

# End-to-end test stack: WordPress + Easy Digital Downloads + MySQL + this service on testnet with simulated
# payments. Needs no store, wallet, or chain accounts. See run.sh and book/src/easy-digital-downloads.md.
name: zcash-edd-e2e

services:
  db:
    image: mysql:26.10@sha256:3819b2b23835c4a73c8b022fafc33c8095c0f81c929a8b7a84613d2fba6c52f5
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uwordpress", "-pwordpress"]
      interval: 3s
      timeout: 3s
      retries: 40

  wordpress:
    image: wordpress:php8.3-apache@sha256:1f59452d2ceed177ad383d17b3a6a7a5c8225d89e34adb36880af8603ac244c2
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${E2E_WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ../zcash-payment-edd:/var/www/html/wp-content/plugins/zcash-payment-edd:ro
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost/wp-includes/version.php"]
      interval: 3s
      timeout: 3s
      retries: 40

  wpcli:
    image: wordpress:cli-php8.3@sha256:6bcc7bb91f5157c4b915e74ee131873e99c1c1ff48f602e4a6f6cd17827305cb
    profiles: ["tools"]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ../zcash-payment-edd:/var/www/html/wp-content/plugins/zcash-payment-edd:ro

  zcash-payment-service:
    build: ../../..
    ports:
      - "127.0.0.1:${E2E_SERVICE_PORT:-8787}:8787"
    environment:
      PORT: 8787
      APP_DATA_DIR: /data
      ZCASH_NETWORK: testnet
      # Incoming viewing key derived from the repository's public test key. It holds no funds.
      ZCASH_UIVK: uivktest1ayc2s599yatrj5kgp2fr4sn0xa2enkykd858d5p7rfwq8u3u65zf3dgzdar2jqzm6nzck5laqdhhfuj849hv8t3gzkgqmecvq49420024aucsy73rxsa9222n8uczqmgus06nx80mjf5kl3tq4qnc3tjj3muhdxhmnavdfqaa8vjk7aqq03ll5sfntag00f4av72q89xwfkw3g26ez3mge8k0xt3kzs5hgzj5sz9fkqdgu4mphd
      ZCASH_BIRTHDAY_HEIGHT: 3000000
      # Exercise received_by_confirmations: orders settle only at depth 2.
      REQUIRED_CONFIRMATIONS: 2
      ZCASH_WEBHOOK_URL: http://wordpress/?rest_route=/zcash-payment-edd/v1/webhook
      ZCASH_WEBHOOK_SECRET: e2e-webhook-secret
      WEBHOOK_POLL_INTERVAL_SECONDS: 1
      PUBLIC_BASE_URL: http://localhost:${E2E_SERVICE_PORT:-8787}
      RETURN_URL_ALLOWED_ORIGINS: ${E2E_WP_URL:-http://localhost:8080}
      ZCASH_DEV_SIMULATED_PAYMENTS: "true"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8787/health"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  wp:

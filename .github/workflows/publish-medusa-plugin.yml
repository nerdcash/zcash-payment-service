name: Publish Medusa plugin

# Publishes plugins/medusa (@nerdcash/medusa-payment-zcash) to npm with trusted publishing (OIDC). No npm token is
# stored in this repo. Trigger: push a tag named medusa-v<version> that matches
# plugins/medusa/package.json. See CONTRIBUTING.md for the release steps.

on:
  push:
    tags:
      - "medusa-v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing and provenance
    defaults:
      run:
        working-directory: plugins/medusa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "medusa-v$version" ]; then
            echo "::error::Tag $TAG does not match package version $version"
            exit 1
          fi
      # The first version of a package is published by hand (see CONTRIBUTING.md), so its tag
      # finds the version already on npm and skips publishing instead of failing. This asks the
      # registry anonymously with curl: `npm view` here goes through setup-node's .npmrc, whose
      # placeholder token can make it fail, and right after a publish the registry can lag, so a
      # miss is retried. The publish step below also treats "already published" as success.
      - name: Check whether this version is already published
        id: published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          url="https://registry.npmjs.org/${name/\//%2f}/$version"
          exists=false
          for attempt in 1 2 3 4 5; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "$url" || true)"
            if [ "$code" = 200 ]; then exists=true; break; fi
            [ "$attempt" = 5 ] || sleep 10
          done
          if [ "$exists" = true ]; then
            echo "::notice::$name@$version is already on npm; skipping publish"
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      # prepack builds the package before it is packed.
      - name: Publish
        if: steps.published.outputs.exists != 'true'
        run: |
          set +e
          npm publish --provenance --access public 2>&1 | tee "$RUNNER_TEMP/publish.log"
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" != 0 ] && grep -q 'cannot publish over the previously published versions' "$RUNNER_TEMP/publish.log"; then
            echo "::notice::This version is already on npm; nothing to publish"
            exit 0
          fi
          exit "$status"

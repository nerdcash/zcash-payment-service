name: GHCR cleanup

on:
  schedule:
    # Daily so GHCR storage stays bounded and the action's manifest cache
    # is not evicted (GitHub drops unused caches after 7 days).
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what would be deleted without deleting
        type: boolean
        default: false

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Prune old images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Delete old GHCR versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          owner: nerdcash
          package: zcash-payment-service
          # Always keep `main` and every release image: `v*`, `latest`, and
          # the plain `<version>` and `<major>.<minor>` tags release.yml adds
          # (matched by `*.*`; SHA tags never contain a dot). The `main` digest also carries the newest SHA
          # tag, so keep-n-tagged counts only older SHA images: 4 yields five
          # SHA tags total (current plus four older).
          exclude-tags: main,latest,v*,*.*
          keep-n-tagged: 4
          # Skip anything pushed in the last day, so a cleanup that overlaps an in-progress
          # publish (ci.yml or release.yml) can't delete platform manifests before their
          # tagged multi-arch index exists.
          older-than: 1 day
          delete-untagged: true
          delete-orphaned-images: true
          delete-partial-images: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

name: Release

# Publishes versioned service images when a v<version> tag is pushed, alongside the :main
# images that ci.yml pushes from every service change on main.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag must match `version` in Cargo.toml. A tag with a pre-release suffix (v0.2.0-rc.1)
# publishes only its own tag. A stable tag also moves :<major>.<minor> when it is the newest
# stable patch in that series, and :latest when it is the newest stable release overall, so
# re-running or publishing an older release never moves those aliases backwards.

on:
  push:
    tags:
      # Only v followed by a digit: a bare "v*" also matches plugin tags such as vendure-v0.1.0.
      - "v[0-9]*"

permissions:
  contents: read

# One release at a time, so two tags pushed together can't race on the shared aliases. If GitHub
# cancels a queued run because a newer one queued behind it, re-run the cancelled one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    name: Publish versioned image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute tags
        id: tags
        shell: bash
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $REF_NAME is not v<major>.<minor>.<patch>[-prerelease]"
            exit 1
          fi
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "$version" != "$crate_version" ]; then
            echo "::error::Tag $REF_NAME does not match Cargo.toml version $crate_version"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          prerelease="${BASH_REMATCH[4]}"
          git fetch --quiet --force --tags origin
          stable='^v[0-9]+\.[0-9]+\.[0-9]+$'
          newest="$(git tag -l 'v[0-9]*' | grep -E "$stable" | sort -V | tail -n1 || true)"
          newest_in_minor="$(git tag -l "v$major.$minor.*" | grep -E "$stable" | sort -V | tail -n1 || true)"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zcash-payment-service"
          {
            echo "tags<<EOF"
            echo "$image:v$version"
            echo "$image:$version"
            if [ -z "$prerelease" ] && [ "$REF_NAME" = "$newest_in_minor" ]; then
              echo "$image:$major.$minor"
            fi
            if [ -z "$prerelease" ] && [ "$REF_NAME" = "$newest" ]; then
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Run tests
        run: cargo test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push zcash-payment-service image for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
